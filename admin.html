<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OL SHOP - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f2f3f7;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 0 0 30px;
      font-size: 30px;
    }

    h2 {
      margin-top: 10px;
      margin-bottom: 18px;
    }

    .login-box,
    .order-card {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 22px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .login-box {
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px 14px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      font-family: inherit;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #555;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.06);
    }

    button {
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .logout-btn {
      background: #c62828;
    }

    .refresh-btn {
      background: #111;
      margin-bottom: 22px;
    }

    .order-card {
      border: 1px solid #e4e4e4;
    }

    .order-card p {
      margin: 9px 0;
      line-height: 1.7;
      word-break: break-word;
    }

    .order-card strong {
      color: #111;
    }

    .proof-box {
      margin-top: 18px;
      padding: 18px;
      background: #f7f7f7;
      border-radius: 12px;
      border: 1px solid #e5e5e5;
    }

    .proof-image {
      display: block;
      width: 100%;
      max-width: 600px;
      max-height: 750px;
      object-fit: contain;
      margin: 14px auto;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
    }

    .proof-link {
      display: block;
      text-align: center;
      padding: 12px;
      background: #e9e9e9;
      color: #111;
      text-decoration: none;
      border-radius: 9px;
      margin-top: 12px;
      font-weight: bold;
    }

    .proof-link:hover {
      background: #ddd;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .success {
      color: #2e7d32;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 30px 20px;
      font-size: 16px;
    }

    /* ==============================
       DESKTOP
    ============================== */

    @media (min-width: 769px) {

      .order-card {
        padding: 28px;
      }

      .refresh-btn {
        max-width: 300px;
      }

    }


    /* ==============================
       TABLET
    ============================== */

    @media (max-width: 768px) {

      body {
        padding: 16px;
      }

      .container {
        max-width: 100%;
      }

      h1 {
        font-size: 25px;
        margin-bottom: 22px;
      }

      h2 {
        font-size: 21px;
      }

      .login-box,
      .order-card {
        padding: 18px;
        border-radius: 14px;
      }

    }


    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 480px) {

      body {
        padding: 10px;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 18px;
      }

      h2 {
        font-size: 19px;
        margin-bottom: 14px;
      }

      .login-box,
      .order-card {
        padding: 14px;
        border-radius: 12px;
        margin-bottom: 15px;
      }

      input,
      select,
      button {
        padding: 13px 12px;
        font-size: 15px;
        min-height: 46px;
      }

      .order-card p {
        font-size: 14px;
        line-height: 1.6;
      }

      .proof-box {
        padding: 12px;
        margin-top: 14px;
      }

      .proof-image {
        max-height: 600px;
        margin: 10px auto;
      }

      .refresh-btn {
        margin-bottom: 16px;
      }

      .proof-link {
        padding: 12px 10px;
        font-size: 14px;
      }

    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛍️ OL SHOP - Admin</h1>

  <!-- LOGIN -->
  <div id="loginSection" class="login-box">

    <h2>🔐 تسجيل الدخول</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      type="button"
      id="loginBtn"
    >
      تسجيل الدخول
    </button>

    <p id="loginMessage"></p>

  </div>


  <!-- ADMIN -->
  <div
    id="adminSection"
    class="hidden"
  >

    <button
      type="button"
      id="logoutBtn"
      class="logout-btn"
    >
      تسجيل الخروج
    </button>

    <h2>📦 الطلبات</h2>

    <!-- REFRESH ORDERS -->
    <button
      type="button"
      id="refreshOrdersBtn"
      class="refresh-btn"
    >
      🔄 تحديث الطلبات
    </button>

    <div id="orders">
      <div class="loading">
        ⏳ جاري تحميل الطلبات...
      </div>
    </div>

  </div>

</div>


<script>

  /* =====================================
     SUPABASE
  ===================================== */

  const SUPABASE_URL =
    'https://ybiwtloollzvuppwfwso.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_G5-hLrph-TuEYG753vTCqA_44qRgyk_';

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================
     ELEMENTS
  ===================================== */

  const loginSection =
    document.getElementById(
      'loginSection'
    );

  const adminSection =
    document.getElementById(
      'adminSection'
    );

  const loginEmail =
    document.getElementById(
      'loginEmail'
    );

  const loginPassword =
    document.getElementById(
      'loginPassword'
    );

  const loginBtn =
    document.getElementById(
      'loginBtn'
    );

  const loginMessage =
    document.getElementById(
      'loginMessage'
    );

  const logoutBtn =
    document.getElementById(
      'logoutBtn'
    );

  const refreshOrdersBtn =
    document.getElementById(
      'refreshOrdersBtn'
    );

  const ordersContainer =
    document.getElementById(
      'orders'
    );


  /* =====================================
     SHOW MESSAGE
  ===================================== */

  function showLoginMessage(
    message,
    type = ''
  ) {

    loginMessage.textContent =
      message;

    loginMessage.className =
      type;

  }


  /* =====================================
     SHOW ADMIN
  ===================================== */

  function showAdmin() {

    loginSection.classList.add(
      'hidden'
    );

    adminSection.classList.remove(
      'hidden'
    );

    loadOrders();

  }


  /* =====================================
     SHOW LOGIN
  ===================================== */

  function showLogin() {

    adminSection.classList.add(
      'hidden'
    );

    loginSection.classList.remove(
      'hidden'
    );

  }


  /* =====================================
     LOGIN
  ===================================== */

  loginBtn.addEventListener(
    'click',
    async function () {

      const email =
        loginEmail.value.trim();

      const password =
        loginPassword.value;


      if (!email || !password) {

        showLoginMessage(
          '❌ اكتب Email وكلمة السر.',
          'error'
        );

        return;

      }


      loginBtn.disabled = true;

      loginBtn.textContent =
        '⏳ جاري تسجيل الدخول...';

      showLoginMessage('');


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({
              email: email,
              password: password
            });


        if (error) {

          console.error(
            'Login error:',
            error
          );

          showLoginMessage(
            '❌ ' + error.message,
            'error'
          );

          return;

        }


        if (
          data &&
          data.session &&
          data.user
        ) {

          showLoginMessage(
            '✅ تم تسجيل الدخول.',
            'success'
          );

          showAdmin();

        } else {

          showLoginMessage(
            '❌ لم يتم إنشاء جلسة تسجيل الدخول.',
            'error'
          );

        }

      } catch (error) {

        console.error(error);

        showLoginMessage(
          '❌ حدث خطأ أثناء تسجيل الدخول.',
          'error'
        );

      } finally {

        loginBtn.disabled = false;

        loginBtn.textContent =
          'تسجيل الدخول';

      }

    }
  );


  /* =====================================
     LOGOUT
  ===================================== */

  logoutBtn.addEventListener(
    'click',
    async function () {

      await supabaseClient.auth.signOut();

      showLogin();

      loginEmail.value = '';

      loginPassword.value = '';

      ordersContainer.innerHTML = '';

    }
  );


  /* =====================================
     REFRESH ORDERS
  ===================================== */

  refreshOrdersBtn.addEventListener(
    'click',
    async function () {

      refreshOrdersBtn.disabled = true;

      refreshOrdersBtn.textContent =
        '⏳ جاري التحديث...';


      try {

        await loadOrders();

      } catch (error) {

        console.error(
          'Refresh error:',
          error
        );

      } finally {

        refreshOrdersBtn.disabled = false;

        refreshOrdersBtn.textContent =
          '🔄 تحديث الطلبات';

      }

    }
  );


  /* =====================================
     CHECK EXISTING SESSION
  ===================================== */

  async function checkSession() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .getSession();


      if (error) {

        console.error(error);

        return;

      }


      if (
        data &&
        data.session &&
        data.session.user
      ) {

        showAdmin();

      } else {

        showLogin();

      }

    } catch (error) {

      console.error(error);

      showLogin();

    }

  }


  /* =====================================
     LOAD ORDERS
  ===================================== */

  async function loadOrders() {

    ordersContainer.innerHTML = `
      <div class="loading">
        ⏳ جاري تحميل الطلبات...
      </div>
    `;


    const {
      data,
      error
    } =
      await supabaseClient
        .from('orders')
        .select('*')
        .order(
          'created_at',
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        'Orders error:',
        error
      );

      ordersContainer.innerHTML = `
        <p class="error">
          ❌ حدث خطأ أثناء تحميل الطلبات.
          <br>
          ${error.message}
        </p>
      `;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      ordersContainer.innerHTML = `
        <p>
          لا توجد طلبات.
        </p>
      `;

      return;

    }


    /* =====================================
       CREATE EACH ORDER
    ===================================== */

    const ordersHtml =
      await Promise.all(

        data.map(
          async function (order) {

            let proofHtml = `
              <div class="proof-box">

                <p>
                  <strong>
                    📸 إثبات الدفع:
                  </strong>

                  لا يوجد
                </p>

              </div>
            `;


            /* =================================
               PAYMENT PROOF
            ================================= */

            if (
              order.payment_proof
            ) {

              console.log(
                'Payment proof:',
                order.payment_proof
              );


              const {
                data: proofData,
                error: proofError
              } =
                await supabaseClient
                  .storage
                  .from(
                    'payment-proofs'
                  )
                  .createSignedUrl(
                    order.payment_proof,
                    3600
                  );


              if (
                !proofError &&
                proofData &&
                proofData.signedUrl
              ) {

                proofHtml = `
                  <div class="proof-box">

                    <p>
                      <strong>
                        📸 إثبات الدفع:
                      </strong>
                    </p>

                    <img
                      src="${proofData.signedUrl}"
                      class="proof-image"
                      alt="إثبات الدفع"
                    >

                    <a
                      href="${proofData.signedUrl}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="proof-link"
                    >
                      🔗 فتح الصورة
                    </a>

                  </div>
                `;

              } else {

                console.error(
                  'Proof error:',
                  proofError
                );

                proofHtml = `
                  <div class="proof-box">

                    <p>
                      <strong>
                        📸 إثبات الدفع:
                      </strong>
                    </p>

                    <p class="error">
                      ⚠️ تعذر تحميل الصورة.
                    </p>

                  </div>
                `;

              }

            }


            /* =================================
               ORDER CARD
            ================================= */

            return `

              <div class="order-card">

                <p>
                  <strong>
                    🆔 ID:
                  </strong>

                  ${order.id || '—'}
                </p>


                <p>
                  <strong>
                    🛍️ المنتج:
                  </strong>

                  ${order.product || '—'}
                </p>


                <p>
                  <strong>
                    💰 السعر:
                  </strong>

                  ${order.price || '—'} TND
                </p>


                <p>
                  <strong>
                    👤 الاسم:
                  </strong>

                  ${order.customer_name || '—'}
                </p>


                <p>
                  <strong>
                    📧 Email:
                  </strong>

                  ${order.email || '—'}
                </p>


                <p>
                  <strong>
                    📱 الهاتف:
                  </strong>

                  ${order.phone || '—'}
                </p>


                <p>
                  <strong>
                    🚚 طريقة التسليم:
                  </strong>

                  ${order.delivery_method || '—'}
                </p>


                <p>
                  <strong>
                    💳 طريقة الدفع:
                  </strong>

                  ${order.payment_method || '—'}
                </p>


                <p>
                  <strong>
                    📝 الملاحظة:
                  </strong>

                  ${order.note || '—'}
                </p>


                ${proofHtml}


                <p>
                  <strong>
                    🎁 Gift Code:
                  </strong>
                </p>


                <input
                  type="text"
                  class="gift-code-input"
                  data-id="${order.id}"
                  value="${order.gift_code || ''}"
                  placeholder="أدخل الكود"
                >


                <p>
                  <strong>
                    📌 الحالة:
                  </strong>
                </p>


                <select
                  class="status-select"
                  data-id="${order.id}"
                >

                  <option
                    value="قيد المعالجة"
                    ${
                      order.status === 'قيد المعالجة'
                        ? 'selected'
                        : ''
                    }
                  >
                    قيد المعالجة
                  </option>


                  <option
                    value="تم الدفع"
                    ${
                      order.status === 'تم الدفع'
                        ? 'selected'
                        : ''
                    }
                  >
                    تم الدفع
                  </option>


                  <option
                    value="تم التسليم"
                    ${
                      order.status === 'تم التسليم'
                        ? 'selected'
                        : ''
                    }
                  >
                    تم التسليم
                  </option>


                  <option
                    value="ملغى"
                    ${
                      order.status === 'ملغى'
                        ? 'selected'
                        : ''
                    }
                  >
                    ملغى
                  </option>

                </select>


                <button
                  type="button"
                  class="save-order-btn"
                  data-id="${order.id}"
                >
                  💾 حفظ
                </button>

              </div>

            `;

          }
        )

      );


    ordersContainer.innerHTML =
      ordersHtml.join('');


    /* =====================================
       SAVE ORDER
    ===================================== */

    document
      .querySelectorAll(
        '.save-order-btn'
      )
      .forEach(
        function (button) {

          button.addEventListener(
            'click',
            async function () {

              const id =
                button.dataset.id;


              const giftInput =
                document.querySelector(
                  `.gift-code-input[data-id="${id}"]`
                );


              const statusSelect =
                document.querySelector(
                  `.status-select[data-id="${id}"]`
                );


              button.disabled = true;

              button.textContent =
                '⏳ جاري الحفظ...';


              const {
                error
              } =
                await supabaseClient
                  .from('orders')
                  .update({

                    gift_code:
                      giftInput.value,

                    status:
                      statusSelect.value

                  })
                  .eq(
                    'id',
                    id
                  );


              if (error) {

                console.error(error);

                alert(
                  '❌ حدث خطأ أثناء الحفظ:\n' +
                  error.message
                );

              } else {

                alert(
                  '✅ تم حفظ الطلب'
                );

              }


              button.disabled = false;

              button.textContent =
                '💾 حفظ';

            }
          );

        }
      );

  }


  /* =====================================
     START
  ===================================== */

  checkSession();

</script>

</body>
</html>
