<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OL SHOP - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-box,
    .order-card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout-btn {
      background: #c62828;
    }

    .order-card p {
      margin: 8px 0;
      line-height: 1.6;
    }

    .proof-box {
      margin-top: 15px;
      padding: 15px;
      background: #f8f8f8;
      border-radius: 10px;
    }

    .proof-image {
      display: block;
      width: 100%;
      max-width: 500px;
      max-height: 700px;
      object-fit: contain;
      margin: 12px auto;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
    }

    .proof-link {
      display: block;
      text-align: center;
      padding: 10px;
      background: #eee;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .success {
      color: #2e7d32;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🛍️ OL SHOP - Admin</h1>

    <!-- LOGIN -->
    <div id="loginSection" class="login-box">

      <h2>🔐 تسجيل الدخول</h2>

      <input
        type="email"
        id="email"
        placeholder="Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button id="loginBtn">
        تسجيل الدخول
      </button>

      <p id="loginMessage"></p>

    </div>


    <!-- ADMIN -->
    <div id="adminSection" class="hidden">

      <button
        id="logoutBtn"
        class="logout-btn"
      >
        تسجيل الخروج
      </button>

      <h2>📦 الطلبات</h2>

      <div id="orders">
        جاري تحميل الطلبات...
      </div>

    </div>

  </div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    'https://ybiwtloollzvuppwfwso.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_G5-hLrph-TuEYG753vTCqA_44qRgyk_';

  const supabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     ELEMENTS
  ========================= */

  const loginSection =
    document.getElementById('loginSection');

  const adminSection =
    document.getElementById('adminSection');

  const loginBtn =
    document.getElementById('loginBtn');

  const logoutBtn =
    document.getElementById('logoutBtn');

  const loginMessage =
    document.getElementById('loginMessage');

  const ordersContainer =
    document.getElementById('orders');


  /* =========================
     LOGIN
  ========================= */

  loginBtn.addEventListener(
    'click',
    async () => {

      const email =
        document
          .getElementById('email')
          .value
          .trim();

      const password =
        document
          .getElementById('password')
          .value;

      if (!email || !password) {

        loginMessage.textContent =
          '❌ أدخل البريد الإلكتروني وكلمة المرور.';

        loginMessage.className =
          'error';

        return;
      }

      loginMessage.textContent =
        '⏳ جاري تسجيل الدخول...';

      loginMessage.className = '';


      const {
        data,
        error
      } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });


      if (error) {

        console.error(error);

        loginMessage.textContent =
          '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.';

        loginMessage.className =
          'error';

        return;
      }


      if (data && data.user) {

        loginMessage.textContent =
          '✅ تم تسجيل الدخول.';

        loginMessage.className =
          'success';

        showAdmin();

      }

    }
  );


  /* =========================
     LOGOUT
  ========================= */

  logoutBtn.addEventListener(
    'click',
    async () => {

      await supabase.auth.signOut();

      adminSection.classList.add('hidden');

      loginSection.classList.remove('hidden');

      ordersContainer.innerHTML = '';

    }
  );


  /* =========================
     SHOW ADMIN
  ========================= */

  function showAdmin() {

    loginSection.classList.add(
      'hidden'
    );

    adminSection.classList.remove(
      'hidden'
    );

    loadOrders();

  }


  /* =========================
     CHECK SESSION
  ========================= */

  async function checkSession() {

    const {
      data
    } = await supabase.auth.getSession();

    if (
      data &&
      data.session &&
      data.session.user
    ) {

      showAdmin();

    }

  }


  /* =========================
     LOAD ORDERS
  ========================= */

  async function loadOrders() {

    ordersContainer.innerHTML =
      '<p>⏳ جاري تحميل الطلبات...</p>';


    const {
      data,
      error
    } = await supabase
      .from('orders')
      .select('*')
      .order(
        'created_at',
        {
          ascending: false
        }
      );


    if (error) {

      console.error(error);

      ordersContainer.innerHTML =
        '<p class="error">❌ حدث خطأ أثناء تحميل الطلبات.</p>';

      return;

    }


    if (!data || data.length === 0) {

      ordersContainer.innerHTML =
        '<p>لا توجد طلبات.</p>';

      return;

    }


    const ordersHtml =
      await Promise.all(

        data.map(
          async (order) => {

            /* =========================
               PAYMENT PROOF
            ========================= */

            let proofHtml = `
              <div class="proof-box">
                <p>
                  <strong>
                    📸 إثبات الدفع:
                  </strong>
                  لا يوجد
                </p>
              </div>
            `;


            if (order.payment_proof) {

              console.log(
                'Payment proof path:',
                order.payment_proof
              );


              const {
                data: proofData,
                error: proofError
              } =
                await supabase.storage
                  .from('payment-proofs')
                  .createSignedUrl(
                    order.payment_proof,
                    3600
                  );


              if (
                !proofError &&
                proofData &&
                proofData.signedUrl
              ) {

                proofHtml = `
                  <div class="proof-box">

                    <p>
                      <strong>
                        📸 إثبات الدفع:
                      </strong>
                    </p>

                    <img
                      src="${proofData.signedUrl}"
                      class="proof-image"
                      alt="إثبات الدفع"
                    >

                    <a
                      href="${proofData.signedUrl}"
                      target="_blank"
                      class="proof-link"
                    >
                      🔗 فتح الصورة
                    </a>

                  </div>
                `;

              } else {

                console.error(
                  'Payment proof error:',
                  proofError
                );


                proofHtml = `
                  <div class="proof-box">

                    <p>
                      <strong>
                        📸 إثبات الدفع:
                      </strong>
                    </p>

                    <p class="error">
                      ⚠️ تعذر تحميل صورة إثبات الدفع.
                    </p>

                  </div>
                `;

              }

            }


            /* =========================
               ORDER HTML
            ========================= */

            return `

              <div class="order-card">

                <p>
                  <strong>🆔 ID:</strong>
                  ${order.id || '—'}
                </p>

                <p>
                  <strong>🛍️ المنتج:</strong>
                  ${order.product || '—'}
                </p>

                <p>
                  <strong>💰 السعر:</strong>
                  ${order.price || '—'} TND
                </p>

                <p>
                  <strong>👤 الاسم:</strong>
                  ${order.customer_name || '—'}
                </p>

                <p>
                  <strong>📧 Email:</strong>
                  ${order.email || '—'}
                </p>

                <p>
                  <strong>📱 الهاتف:</strong>
                  ${order.phone || '—'}
                </p>

                <p>
                  <strong>🚚 طريقة التسليم:</strong>
                  ${order.delivery_method || '—'}
                </p>

                <p>
                  <strong>💳 طريقة الدفع:</strong>
                  ${order.payment_method || '—'}
                </p>

                <p>
                  <strong>📝 الملاحظة:</strong>
                  ${order.note || '—'}
                </p>

                ${proofHtml}


                <p>
                  <strong>
                    🎁 Gift Code:
                  </strong>
                </p>

                <input
                  type="text"
                  class="gift-code-input"
                  data-id="${order.id}"
                  value="${order.gift_code || ''}"
                  placeholder="أدخل الكود"
                >


                <p>
                  <strong>
                    📌 الحالة:
                  </strong>
                </p>

                <select
                  class="status-select"
                  data-id="${order.id}"
                >

                  <option
                    value="قيد المعالجة"
                    ${
                      order.status === 'قيد المعالجة'
                        ? 'selected'
                        : ''
                    }
                  >
                    قيد المعالجة
                  </option>

                  <option
                    value="تم الدفع"
                    ${
                      order.status === 'تم الدفع'
                        ? 'selected'
                        : ''
                    }
                  >
                    تم الدفع
                  </option>

                  <option
                    value="تم التسليم"
                    ${
                      order.status === 'تم التسليم'
                        ? 'selected'
                        : ''
                    }
                  >
                    تم التسليم
                  </option>

                  <option
                    value="ملغى"
                    ${
                      order.status === 'ملغى'
                        ? 'selected'
                        : ''
                    }
                  >
                    ملغى
                  </option>

                </select>


                <button
                  class="save-order-btn"
                  data-id="${order.id}"
                >
                  💾 حفظ
                </button>

              </div>

            `;

          }
        )

      );


    ordersContainer.innerHTML =
      ordersHtml.join('');


    /* =========================
       SAVE ORDER
    ========================= */

    document
      .querySelectorAll(
        '.save-order-btn'
      )
      .forEach(
        (button) => {

          button.addEventListener(
            'click',
            async () => {

              const id =
                button.dataset.id;


              const giftInput =
                document.querySelector(
                  `.gift-code-input[data-id="${id}"]`
                );


              const statusSelect =
                document.querySelector(
                  `.status-select[data-id="${id}"]`
                );


              const {
                error: updateError
              } =
                await supabase
                  .from('orders')
                  .update({

                    gift_code:
                      giftInput.value,

                    status:
                      statusSelect.value

                  })
                  .eq(
                    'id',
                    id
                  );


              if (updateError) {

                console.error(
                  updateError
                );

                alert(
                  '❌ حدث خطأ أثناء الحفظ'
                );

              } else {

                alert(
                  '✅ تم حفظ الطلب'
                );

              }

            }
          );

        }
      );

  }


  /* =========================
     START
  ========================= */

  checkSession();

</script>

</body>
</html>
